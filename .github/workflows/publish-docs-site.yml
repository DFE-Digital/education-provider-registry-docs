name: Publish documentation site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-docs-site.yml"
      - "docs-site/**"
      - "features/**"
      - "business-domain/**"
      - "information/**"
      - "models/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate feature pages from Gherkin
        shell: pwsh
        run: ./docs-site/scripts/generate-feature-pages.ps1

      - name: Copy business domain pages
        shell: pwsh
        run: ./docs-site/scripts/copy-business-domain-pages.ps1

      - name: Copy information pages
        shell: pwsh
        run: ./docs-site/scripts/copy-information-pages.ps1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate vocabulary pages from Turtle
        shell: pwsh
        run: ./docs-site/scripts/generate-vocabulary-pages.ps1

      - name: Generate governance vocabulary pages from Turtle
        shell: pwsh
        run: |
          ./docs-site/scripts/generate-vocabulary-pages.ps1 `
            -VocabularyPath "models/governance/governance-vocabulary.ttl" `
            -OutputRoot "docs-site/content/models/governance/vocabulary" `
            -VocabularyPrefix "gov" `
            -CanonicalUriBase "https://dfe-digital.github.io/education-provider-registry-docs/models/governance/vocabulary/" `
            -VocabularyTitle "Governance vocabulary" `
            -SourceTtlLabel "models/governance/governance-vocabulary.ttl" `
            -SourceTtlUrl "https://github.com/DFE-Digital/education-provider-registry-docs/blob/main/models/governance/governance-vocabulary.ttl" `
            -ReferencesDocPath "models/governance/governance-real-world-references.md"

      - name: Generate taxonomy page from Turtle
        shell: pwsh
        run: ./docs-site/scripts/generate-taxonomy-pages.ps1

      - name: Generate governance taxonomy page from Turtle
        shell: pwsh
        run: |
          ./docs-site/scripts/generate-taxonomy-pages.ps1 `
            -TaxonomyPath "models/governance/governance-taxonomy.ttl" `
            -OutputRoot "docs-site/content/models/governance/taxonomy" `
            -CompactPrefix "gov" `
            -ExtraPrefixes @("est") `
            -TaxonomyScheme "gov:governanceTaxonomy" `
            -PageTitle "Governance Taxonomy" `
            -SourceLabel "models/governance/governance-taxonomy.ttl"

      - name: Generate UI coverage pages from Turtle
        shell: pwsh
        run: ./docs-site/scripts/generate-ui-coverage-pages.ps1

      - name: Generate field rules page from SHACL
        shell: pwsh
        run: ./docs-site/scripts/generate-shacl-rules-page.ps1

      - name: Generate data quality rules page from SHACL
        shell: pwsh
        run: ./docs-site/scripts/generate-data-quality-rules-page.ps1

      - name: Generate per-type field rules page from SHACL
        shell: pwsh
        run: ./docs-site/scripts/generate-establishment-type-rules-page.ps1

      - name: Copy model markdown pages
        shell: pwsh
        run: ./docs-site/scripts/copy-model-pages.ps1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: docs-site

      - name: Compile Nanoc site
        working-directory: docs-site
        run: bundle exec nanoc compile

      - name: Copy information download assets
        shell: pwsh
        run: ./docs-site/scripts/copy-information-assets.ps1

      - name: Cache vendored JS/CSS assets
        uses: actions/cache@v4
        with:
          path: docs-site/output/assets/vendor
          key: vendor-assets-mermaid-11.14.0-hljs-11

      - name: Download vendored JS/CSS assets
        shell: pwsh
        run: ./docs-site/scripts/download-vendor-assets.ps1

      - name: Cache WIDOCO
        uses: actions/cache@v4
        with:
          path: widoco.jar
          key: widoco-1.4.25

      - name: Download WIDOCO
        run: |
          if [ ! -f widoco.jar ]; then
            curl -L -o widoco.jar \
              https://github.com/dgarijo/Widoco/releases/download/v1.4.25/widoco-1.4.25-jar-with-dependencies_JDK-17.jar
          fi

      - name: Generate ontology documentation
        run: |
          java -jar widoco.jar \
            -ontFile models/establishment/establishment-ontology.ttl \
            -outFolder docs-site/output/models/establishment/ontology \
            -lang en \
            -includeAnnotationProperties \
            -webVowl \
            -noPlaceHolderText \
            -rewriteAll
          mv docs-site/output/models/establishment/ontology/doc/* docs-site/output/models/establishment/ontology/
          rm -rf docs-site/output/models/establishment/ontology/doc
          if [ ! -f docs-site/output/models/establishment/ontology/index.html ]; then
            cp docs-site/output/models/establishment/ontology/index-en.html docs-site/output/models/establishment/ontology/index.html
          fi

      - name: Generate governance ontology documentation
        run: |
          java -jar widoco.jar \
            -ontFile models/governance/governance-ontology.ttl \
            -outFolder docs-site/output/models/governance/ontology \
            -lang en \
            -includeAnnotationProperties \
            -webVowl \
            -noPlaceHolderText \
            -rewriteAll
          mv docs-site/output/models/governance/ontology/doc/* docs-site/output/models/governance/ontology/
          rm -rf docs-site/output/models/governance/ontology/doc
          if [ ! -f docs-site/output/models/governance/ontology/index.html ]; then
            cp docs-site/output/models/governance/ontology/index-en.html docs-site/output/models/governance/ontology/index.html
          fi

      - name: Set up Node.js for staticrypt
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Protect internal sections with password
        env:
          DOCS_PASSWORD: ${{ secrets.DOCS_SITE_PASSWORD }}
        run: |
          set -e
          if [ -z "$DOCS_PASSWORD" ]; then
            echo "Error: DOCS_SITE_PASSWORD secret is not set in this repository."
            exit 1
          fi
          npm install -g staticrypt@3
          TMPDIR_ENC=$(mktemp -d)

          # Only the models/ section index page is password-gated - no
          # remember-me (simple password gate, no session storage). Everything
          # below models/ (vocabulary, taxonomy, ontology/WebVOWL, examples,
          # governance) is public, so WIDOCO/WebVOWL's client-side JS fetches
          # to sibling .html files work without hitting another password gate.
          file="docs-site/output/models/index.html"
          staticrypt "$file" \
            --password "$DOCS_PASSWORD" \
            --directory "$TMPDIR_ENC" \
            --no-remember \
            --short \
            --template "docs-site/staticrypt-template.html" \
            --template-color-primary "#1d70b8"
          cp "$TMPDIR_ENC/$(basename "$file")" "$file"

          rm -rf "$TMPDIR_ENC"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
